name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            infra/package-lock.json

      - run: npm ci --prefix backend
      - run: npm test --prefix backend

      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npx tsc -b --noEmit
        working-directory: frontend
      - run: npm test --prefix frontend

      - run: npm ci --prefix infra
      - run: npm test --prefix infra

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # deploys queue instead of colliding (UPDATE_IN_PROGRESS); GitHub keeps only the newest queued run,
    # which is fine as each run deploys the tip of main. pull requests get their own group so they can never join the queue
    concurrency:
      group: ${{ github.event_name == 'push' && 'deploy' || format('no-deploy-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            infra/package-lock.json

      - run: npm ci --prefix infra

      # cdk deploy zips up backend/ as-is for the Lambda asset, so its
      # dependencies must be installed here too, not just infra's
      - run: npm ci --prefix backend

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::300052334965:role/github-actions-loggers-world-deploy
          aws-region: af-south-1

      - run: npx cdk deploy InfraStack --require-approval never
        working-directory: infra
        env:
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
